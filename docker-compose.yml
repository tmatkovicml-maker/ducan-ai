services:
  web:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./brand:/app/brand:ro
      - ./seed:/app/seed:ro
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "ducan.jobs.scheduler"]
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./brand:/app/brand:ro
    restart: unless-stopped
    depends_on:
      - web

  caddy:
    image: caddy:2.8
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
