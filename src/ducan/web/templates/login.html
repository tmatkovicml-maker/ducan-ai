{% extends "base.html" %}
{% block title %}Prijava · Dućan AI{% endblock %}
{% block content %}
<div class="card login">
  <h1>Prijava</h1>
  {% if error %}<p class="errors" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Lozinka <input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Prijavi se</button>
  </form>
</div>
{% endblock %}
